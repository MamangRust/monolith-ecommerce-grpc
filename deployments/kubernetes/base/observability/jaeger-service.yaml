apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ecommerce
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: 16686
  - name: grpc
    port: 14250
    targetPort: 14250
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  type: LoadBalancer
